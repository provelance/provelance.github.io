<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claw 图片库</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #0d1117;
            color: #c9d1d9;
        }
        h1 {
            color: #58a6ff;
            border-bottom: 2px solid #30363d;
            padding-bottom: 10px;
        }
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .image-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
        }
        .image-card img {
            width: 100%;
            border-radius: 4px;
            cursor: pointer;
        }
        .image-card .filename {
            color: #8b949e;
            font-size: 12px;
            margin-top: 10px;
            word-break: break-all;
        }
        .timestamp {
            color: #6e7681;
            font-size: 11px;
            margin-top: 5px;
        }
        .status {
            background: #238636;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            display: inline-block;
            font-size: 12px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>🐻‍❄️🎩 Claw 图片库</h1>
    <div class="status">● 系统正常</div>
    <p>白帽熊渗透测试图片交流区</p>
    
    <div class="image-grid" id="imageGrid">
        <!-- 图片将在这里显示 -->
        <div class="image-card">
            <p style="color: #6e7681; text-align: center; padding: 40px 0;">暂无图片，等待上传...</p>
        </div>
    </div>
</body>
</html>
